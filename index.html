<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Семейная летопись</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&amp;display=swap" rel="stylesheet">
<style>
body { background: #f8f4eb; color: #3f2a1e; }
.title { font-family:'Great Vibes',cursive; font-size:5rem; color:#3f2a1e; text-align:center; margin:10px 0 20px; letter-spacing:6px; text-shadow:3px 3px 8px rgba(0,0,0,0.1); }
.person-card { transition:all 0.3s; cursor:pointer; background:#fffaf0; }
.person-card:hover { transform:translateY(-5px); box-shadow:0 15px 25px -5px rgb(139 69 19 / 0.3); }
.photo-card:hover { transform:scale(1.04); box-shadow:0 10px 25px rgba(0,0,0,0.15); }
.tab-button { color:#6b5c4a; }
.tab-button.active { color:#3f2a1e; }
.photo-sort-btn, .photo-filter-btn {
  padding: 6px 14px; border-radius: 14px;
  background: #f0e6d2; color: #6b5c4a;
  font-size: 0.85rem; font-weight: 700; cursor: pointer;
  border: 1px solid #d4b89e; transition: all 0.15s;
}
.photo-sort-btn:hover, .photo-filter-btn:hover { background: #e8d9bf; color: #3f2a1e; }
.photo-sort-btn.active, .photo-filter-btn.active { background: #8d5524; color: #fff; border-color: #8d5524; }
.photo-kind-badge {
  display: inline-block; padding: 2px 10px; border-radius: 10px;
  font-size: 0.75rem; font-weight: 700;
  background: #f0e6d2; color: #6b5c4a; margin-bottom: 6px;
}
.back-btn {
  display:inline-flex; align-items:center; gap:6px;
  background:#6b5c4a; color:#fff; padding:8px 18px;
  border-radius:14px; font-weight:700; font-size:0.9rem;
  cursor:pointer; border:none;
}
.back-btn:hover { background:#4e4136; }

.tree-viewport {
  position: relative; overflow: hidden;
  background: #fffaf0; border-radius: 20px;
  border: 1px solid #f0e6d2;
  cursor: grab; user-select: none; -webkit-user-select: none;
  touch-action: none;
}
.tree-viewport.dragging { cursor: grabbing; }
.tree-canvas {
  position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
  width: max-content;
  padding: 20px;
}
.zoom-controls {
  position: absolute; right: 14px; bottom: 14px;
  display: flex; gap: 4px; z-index: 5;
  background: rgba(255,250,240,0.96);
  padding: 5px; border-radius: 12px;
  border: 1px solid #d4b89e;
  box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}
.zoom-controls button {
  width: 34px; height: 34px; border-radius: 8px;
  background: #f0e6d2; color: #6b5c4a;
  border: 1px solid #d4b89e;
  font-weight: 700; font-size: 16px;
  cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.zoom-controls button:hover { background: #e8d9bf; color: #3f2a1e; }
.zoom-controls .zoom-level {
  padding: 0 8px; font-size: 0.8rem; font-weight: 700;
  color: #6b5c4a; display: inline-flex; align-items: center;
  min-width: 46px; justify-content: center;
}
.tree-help {
  position: absolute; left: 14px; bottom: 14px;
  font-size: 0.72rem; color: #8a7a68;
  background: rgba(255,250,240,0.9);
  padding: 4px 10px; border-radius: 10px;
  border: 1px solid #f0e6d2;
  z-index: 5; pointer-events: none;
}

.tree { display: inline-block; text-align: center; }
.tree, .tree ul { margin: 0; padding: 0; list-style: none; }
.tree ul { display: flex; justify-content: center; padding-top: 28px; position: relative; }
.tree li { display: flex; flex-direction: column; align-items: center; position: relative; padding: 28px 8px 0; list-style: none; }
.tree li::before, .tree li::after {
  content: ''; position: absolute; top: 0; right: 50%;
  border-top: 2px solid #8d5524; width: 50%; height: 28px;
}
.tree li::after { right: auto; left: 50%; border-left: 2px solid #8d5524; }
.tree li:only-child::after, .tree li:only-child::before { display: none; }
.tree li:only-child { padding-top: 0; }
.tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
.tree li:last-child::before { border-right: 2px solid #8d5524; border-radius: 0 6px 0 0; }
.tree li:first-child::after { border-radius: 6px 0 0 0; }
.tree ul ul::before {
  content: ''; position: absolute; top: 0; left: 50%;
  border-left: 2px solid #8d5524; width: 0; height: 28px;
}

.node-wrapper {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  position: relative;
  z-index: 1;
}

.tree-node {
  display: inline-flex; flex-direction: column; align-items: center;
  background: #fff;
  border: 2px solid #8d5524; border-radius: 16px;
  padding: 10px 12px; cursor: pointer;
  transition: all 0.2s;
  min-width: 120px; max-width: 210px;
  text-align: center;
  position: relative; z-index: 1;
  box-shadow: 0 4px 10px rgba(139,69,19,0.08);
}
.tree-node:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 20px -6px rgb(139 69 19 / 0.35);
  filter: brightness(1.03);
}
.tree-node.is-main { border-width: 3px; }
.tree-node.is-spouse {
  border-style: dashed;
  min-width: 100px; max-width: 180px;
  padding: 8px 10px;
  filter: saturate(0.75);
}

.node-photo {
  width: 64px; height: 64px;
  border-radius: 12px;
  object-fit: cover;
  margin: 0 auto 6px;
  display: block;
  border: 2px solid rgba(255,255,255,0.7);
  background: #f5e8d3;
}
.node-photo-emoji {
  font-size: 2.2rem;
  line-height: 64px;
  text-align: center;
  margin: 0 auto 6px;
  width: 64px; height: 64px;
  border-radius: 12px;
  border: 2px solid rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.55);
  display: block;
}
.node-name { font-weight: 700; font-size: 0.86rem; color: #3f2a1e; line-height: 1.2; }
.node-years { font-size: 0.66rem; color: #5c4033; margin-top: 2px; opacity: 0.85; }

.couple-link {
  width: 22px;
  height: 2px;
  background: #c0392b;
  position: relative;
  align-self: center;
}
.couple-link::after {
  content: '💍';
  position: absolute;
  top: -10px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  background: #fffaf0;
  padding: 0 2px;
}

.couple-link.partner-link::after { content: '👩‍❤️‍💋‍👨'; }

.pair-children {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  padding-top: 28px;
}
.pair-children::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  border-left: 2px solid #8d5524;
  height: 28px;
}
.pair-children > ul { padding-top: 0; }

.list-photo {
  width: 60px; height: 60px;
  border-radius: 14px;
  object-fit: cover;
  border: 2px solid #d4b89e;
  background: #f5e8d3;
  flex-shrink: 0;
}
.list-photo-emoji {
  width: 60px; height: 60px;
  border-radius: 14px;
  border: 2px solid #d4b89e;
  background: #f5e8d3;
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem;
  flex-shrink: 0;
}

.palette-0 { background: linear-gradient(180deg, #fff8ec 0%, #f7e6cf 100%); border-color: #b07a44; }
.palette-1 { background: linear-gradient(180deg, #fff1e4 0%, #f3d5b5 100%); border-color: #c98a4b; }
.palette-2 { background: linear-gradient(180deg, #fdeede 0%, #eec9a3 100%); border-color: #d49a58; }
.palette-3 { background: linear-gradient(180deg, #fbe7d3 0%, #e6b98a 100%); border-color: #c68a48; }
.palette-4 { background: linear-gradient(180deg, #f7e0c8 0%, #d9a878 100%); border-color: #b57a3d; }
.palette-5 { background: linear-gradient(180deg, #f1d7ba 0%, #c89468 100%); border-color: #a06c30; }
.palette-6 { background: linear-gradient(180deg, #ebcfae 0%, #b88355 100%); border-color: #8d5524; }
.tree-node.is-deceased { border-color:#4a5568; box-shadow:0 4px 10px rgba(74,85,104,0.28); }
.tree-node.is-deceased:hover { box-shadow:0 12px 20px -6px rgb(74 85 104 / 0.45); }
.person-card.is-deceased { border-color:#4a5568 !important; }
.tree-badge { display:inline-block; margin-top:4px; padding:1px 8px; border-radius:8px; background:#f0e6d2; color:#6b5c4a; font-size:.7rem; font-weight:700; }
/* адаптивность */
#modal{overflow-y:auto;align-items:flex-start!important;padding:12px 0}
#modal>div{margin-top:auto;margin-bottom:auto}
@media (max-width:640px){
.title{font-size:2.6rem!important;letter-spacing:2px!important;margin:6px 0 12px!important}
#contentContainer,#tabsWrapper,#backBar{padding-left:10px!important;padding-right:10px!important}
#content-main,#content-list,#content-photos,#personalTreeGalleryPage{padding:14px!important;border-radius:20px!important}
#tabsBar{gap:4px!important;margin-bottom:14px!important}
.tab-button{padding:8px 10px!important;font-size:.85rem}
#tabsBar>.ml-auto{margin-left:0!important;width:100%;justify-content:space-between}
.zoom-controls button{width:40px;height:40px}
.tree-help{display:none}
}
/* галерея */
.gal-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-bottom:12px}
.gal-row>span{font-size:.85rem;font-weight:700;color:#6b5c4a}
.gal-h{font-weight:700;font-size:1.1rem;color:#5c4033;border-bottom:1px solid #d4b89e;padding-bottom:4px;margin-top:8px}
/* окно фото и просмотрщик */
.pdlg,#viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:12px}
#viewer.hidden{display:none}
.pdlg-box{background:#fff;border-radius:20px;width:100%;max-width:560px;margin:auto;overflow:hidden}
.pdlg-head{display:flex;justify-content:space-between;align-items:center;background:#5c4033;color:#fff;padding:12px 16px}
.pdlg-head button{background:none;border:0;color:#fff;font-size:28px;line-height:1;cursor:pointer}
.pdlg-body{padding:14px 16px}
.pdlg-body label{display:block;font-size:.8rem;font-weight:700;color:#6b5c4a;margin:10px 0 3px}
.pdlg-body input,.pdlg-body select,.pdlg-body textarea{width:100%;box-sizing:border-box;border:1px solid #d4b89e;border-radius:10px;padding:9px;font-size:16px;background:#fffaf0}
.pdlg-foot{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #f0e6d2}
.pdlg-foot button,.vw-actions button{background:#8d5524;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.pdlg-foot .sec{background:#6b5c4a}
.crop-stage{position:relative;display:inline-block;touch-action:none;user-select:none;-webkit-user-select:none;max-width:100%;overflow:hidden;line-height:0;border-radius:8px;background:#eee}
.crop-stage img{max-width:100%;max-height:50vh;display:block;pointer-events:none}
#cropRect{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);box-sizing:border-box;cursor:move}
#cropRect i{position:absolute;width:18px;height:18px;background:#fff;border:2px solid #8d5524;border-radius:5px;box-sizing:border-box}
#cropRect i:nth-child(1){left:-9px;top:-9px}#cropRect i:nth-child(2){right:-9px;top:-9px}
#cropRect i:nth-child(3){left:-9px;bottom:-9px}#cropRect i:nth-child(4){right:-9px;bottom:-9px}
.crop-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0;font-size:.8rem;color:#6b5c4a}
.crop-tools select{width:auto!important;padding:6px!important}
.crop-tools button{background:#6b5c4a;color:#fff;border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}
.vw-box{background:#fff;border-radius:20px;width:100%;max-width:1100px;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
.vw-img{position:relative;background:#1f1a15;display:flex;align-items:center;justify-content:center}
.vw-img img{max-width:100%;max-height:58vh;object-fit:contain;display:block}
.vw-info{padding:16px;line-height:1.5;font-size:.95rem}
.vw-info p{margin:6px 0}
.vw-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.vw-actions .del{background:#b91c1c}
.vw-x{position:absolute;top:8px;right:10px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:24px;cursor:pointer}
.vw-nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:56px;border:0;border-radius:10px;background:rgba(0,0,0,.45);color:#fff;font-size:30px;cursor:pointer}
.vw-nav.l{left:8px}.vw-nav.r{right:8px}
@media (min-width:860px){.vw-box{flex-direction:row}.vw-img{flex:1 1 auto}.vw-img img{max-height:86vh}.vw-info{flex:0 0 340px;max-height:86vh;overflow-y:auto}}
</style>

<body>

<div id="backBar" class="max-w-6xl mx-auto px-6 pt-6 hidden">
  <button class="back-btn" onclick="location.hash=''">← Вернуться к общей семье</button>
</div>

<h1 class="title" id="mainTitle">Семейная летопись</h1>

<div class="max-w-6xl mx-auto px-6" id="tabsWrapper">
  <div class="flex flex-wrap gap-2 mb-8 border-b border-[#d4b89e] pb-2" id="tabsBar">
    <button onclick="showTab('main')" class="tab-button px-6 py-3 font-bold" id="tab-main">👨‍👩‍👧 Наша Семья</button>
    <button onclick="showTab('list')" class="tab-button px-6 py-3 font-bold" id="tab-list">📋 Все люди</button>
    <button onclick="showTab('photos')" class="tab-button px-6 py-3 font-bold active border-b-4 border-[#8d5524]" id="tab-photos">📸 Семейные фото</button>
    <div class="ml-auto flex items-center gap-2">
<button onclick="saveChanges()" class="bg-emerald-700 hover:bg-emerald-800 text-white px-6 py-2.5 rounded-2xl font-bold">☁️ Сохранить для всех</button>
<button onclick="saveHtml()" class="bg-[#6b5c4a] hover:bg-[#4e4136] text-white px-3 py-1.5 rounded-xl text-xs font-bold">сохранить .html</button>
</div>
  </div>

function getPerson(id) { return family.find(p => p.id === id); }
function getSpouses(person) {
  if (!person || !Array.isArray(person.spouseIds)) return [];
  return person.spouseIds.map(getPerson).filter(Boolean);
}
function isPartner(person) { return person && /партн|мужчин/i.test(person.relationType || ""); }
function canHavePersonalTree(person) { return person && person.side === "spouse"; }

function migrate() {
  family.forEach(p => {
    if (!Array.isArray(p.spouseIds)) p.spouseIds = [];
    p.spouseIds = [...new Set(p.spouseIds)];
    if (!('parentId2' in p)) p.parentId2 = null;
    if (!('side' in p)) p.side = "main";
    if (typeof p.palette !== "number") p.palette = 1;
  });
  family.forEach(p => {
    p.spouseIds.forEach(sid => {
      const s = getPerson(sid);
      if (s && !Array.isArray(s.spouseIds)) s.spouseIds = [];
      if (s && !s.spouseIds.includes(p.id)) s.spouseIds.push(p.id);
    });
  });
  if (!personalTreePhotos || typeof personalTreePhotos !== 'object') personalTreePhotos = {};
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      family, familyPhotos, personalTreePhotos,
      currentPhotoSort, currentPhotoFilter
    }));
  } catch(e) { console.warn(e); }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (Array.isArray(d.family) && d.family.length) {
      family = d.family;
      familyPhotos = Array.isArray(d.familyPhotos) ? d.familyPhotos : [];
      personalTreePhotos = (d.personalTreePhotos && typeof d.personalTreePhotos === 'object') ? d.personalTreePhotos : {};
      if (d.currentPhotoSort) currentPhotoSort = d.currentPhotoSort;
      if (d.currentPhotoFilter) currentPhotoFilter = d.currentPhotoFilter;
      restoreInitialPeople();
      migrate();
      return true;
    }
  } catch(e) { console.warn(e); }
  return false;
}

/* ================== ДЕРЕВО ================== */
function buildChildrenMap(members) {
  const ids = new Set(members.map(m => m.id));
  const map = new Map();
  members.forEach(m => map.set(m.id, []));
  members.forEach(p => {
    if (p.parentId !== null && p.parentId !== undefined && ids.has(p.parentId)) {
      map.get(p.parentId).push(p);
    }
  });
  return map;
}
function findRoots(members) {
  const ids = new Set(members.map(m => m.id));
  return members.filter(p => p.parentId === null || p.parentId === undefined || !ids.has(p.parentId));
}
function groupChildrenBySecondParent(children) {
  const groups = new Map();
  children.forEach(ch => {
    const key = ch.parentId2 !== null && ch.parentId2 !== undefined ? ch.parentId2 : "__none__";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(ch);
  });
  return groups;
}

function renderTree() {
  const container = document.getElementById("treeContainer");
  container.innerHTML = "";

  const members = family.filter(p => p.side === "main");
  if (members.length === 0) {
    container.innerHTML = `<p class="text-center text-gray-500">Нет данных</p>`;
    return;
  }
  const roots = findRoots(members);
  const childrenMap = buildChildrenMap(members);
  const rendered = new Set();

  const { vp, canvas } = createTreeViewport();
  const treeDiv = document.createElement("div");
  treeDiv.className = "tree";
  const rootUl = document.createElement("ul");
  roots.forEach(root => {
    if (rendered.has(root.id)) return;
    renderPersonBranch(root, rootUl, childrenMap, rendered);
  });
  treeDiv.appendChild(rootUl);
  canvas.appendChild(treeDiv);
  container.appendChild(vp);
  fitTreeView();
}

function renderPersonBranch(person, parentUl, childrenMap, rendered) {
  if (rendered.has(person.id)) return;
  rendered.add(person.id);

  const li = document.createElement("li");
  const wrapper = document.createElement("div");
  wrapper.className = "node-wrapper";

  const spouses = getSpouses(person);
  const palette = person.palette || 1;

  if (spouses.length === 0) {
    wrapper.appendChild(makeNode(person, true, palette));
  } else if (spouses.length === 1) {
    wrapper.appendChild(makeNode(person, true, palette));
    wrapper.appendChild(makeCoupleLink(spouses[0]));
    wrapper.appendChild(makeNode(spouses[0], false, palette));
  } else {
    wrapper.appendChild(makeNode(spouses[0], false, palette));
    wrapper.appendChild(makeCoupleLink(spouses[0]));
    wrapper.appendChild(makeNode(person, true, palette));
    for (let i = 1; i < spouses.length; i++) {
      wrapper.appendChild(makeCoupleLink(spouses[i]));
      wrapper.appendChild(makeNode(spouses[i], false, palette));
    }
  }
  li.appendChild(wrapper);

  const children = (childrenMap.get(person.id) || []).filter(ch => !rendered.has(ch.id));
  if (children.length > 0) {
    const groups = groupChildrenBySecondParent(children);
    if (groups.size === 1) {
      const ul = document.createElement("ul");
      [...groups.values()][0].forEach(ch => renderPersonBranch(ch, ul, childrenMap, rendered));
      li.appendChild(ul);
    } else {
      const pairWrap = document.createElement("div");
      pairWrap.style.display = "flex";
      pairWrap.style.justifyContent = "center";
      pairWrap.style.alignItems = "flex-start";
      pairWrap.style.gap = "20px";
      pairWrap.style.paddingTop = "28px";
      pairWrap.style.position = "relative";
      const stem = document.createElement("div");
      stem.style.position = "absolute";
      stem.style.top = "0"; stem.style.left = "50%";
      stem.style.borderLeft = "2px solid #8d5524";
      stem.style.height = "28px";
      pairWrap.appendChild(stem);
      groups.forEach(kids => {
        const col = document.createElement("div");
        col.className = "pair-children";
        const ul = document.createElement("ul");
        ul.style.paddingTop = "0";
        kids.forEach(ch => renderPersonBranch(ch, ul, childrenMap, rendered));
        col.appendChild(ul);
        pairWrap.appendChild(col);
      });
      li.appendChild(pairWrap);
    }
  }
  parentUl.appendChild(li);
}

function makeNode(person, isMain, palette) {
  const div = document.createElement("div");
  const pal = typeof palette === "number" ? palette : (person.palette || 1);
  div.className = "tree-node palette-" + pal + " " + (isMain ? "is-main" : "is-spouse");
  div.onclick = (e) => { e.stopPropagation(); showPerson(person.id); };

  const photoHtml = person.photoData
    ? `<img src="${person.photoData}" class="node-photo" alt="${person.name}">`
    : `<div class="node-photo-emoji">${person.photo || '👤'}</div>`;

  div.innerHTML = `
    ${photoHtml}
    <div class="node-name">${person.name}</div>
    ${person.years ? `<div class="node-years">${person.years}</div>` : ''}
  `;
  return div;
}

function makeCoupleLink(spouse) {
  const link = document.createElement("div");
  link.className = "couple-link" + (isPartner(spouse) ? " partner-link" : "");
  return link;
}

/* ================== ДРЕВО ДОБАВОЧНОГО СУПРУГА ==================
   Собираем всё, что связано с родом супруга(ов) владельца:
   - самого владельца,
   - всех его супругов/партнёров,
   - ВСЕХ потомков каждого супруга (включая детей от других браков),
   - супругов этих потомков.
*/
function getPersonalTreeMembers(ownerId) {
  const owner = getPerson(ownerId);
  if (!owner) return [];

  const included = new Set();
  const queue = [];

  // 1. Владелец
  included.add(owner.id);
  queue.push(owner.id);

  // 2. Все его супруги/партнёры
  const ownerSpouses = getSpouses(owner);
  ownerSpouses.forEach(s => {
    if (!included.has(s.id)) {
      included.add(s.id);
      queue.push(s.id);
    }
  });

  // 3. Обходим в ширину: от каждого узла берём всех его потомков,
  //    добавляем их и их супругов, ставим в очередь.
  const queued = new Set(queue);
  while (queue.length > 0) {
    const pid = queue.shift();
    family.forEach(ch => {
      // Ребёнок, если pid — один из его родителей
      if (ch.parentId !== pid && ch.parentId2 !== pid) return;
      if (included.has(ch.id)) return;

      included.add(ch.id);
      if (!queued.has(ch.id)) { queued.add(ch.id); queue.push(ch.id); }

      // Подтягиваем супругов этого потомка
      getSpouses(ch).forEach(sp => {
        if (!included.has(sp.id)) {
          included.add(sp.id);
          if (!queued.has(sp.id)) { queued.add(sp.id); queue.push(sp.id); }
        }
      });
    });
  }

  return [...included].map(getPerson).filter(Boolean);
}

function goToPersonalTree(ownerId) { location.hash = 'tree_' + ownerId; }

  const tw = document.getElementById("tabsWrapper");
  if (tw) tw.classList.add("hidden");

  if (title) title.textContent = owner ? "Древо: " + owner.name : "Древо";

  const container = document.getElementById("treeContainer");
  container.innerHTML = "";

  const members = getPersonalTreeMembers(ownerId);
  const childrenMap = buildChildrenMap(members);
  const rendered = new Set();

  const { vp, canvas } = createTreeViewport();

  treeDiv.className = "tree";
  const rootUl = document.createElement("ul");
  if (owner) renderPersonBranch(owner, rootUl, childrenMap, rendered);

  canvas.appendChild(treeDiv);

  const galleryWrap = document.createElement("div");
  galleryWrap.className = "mt-6 flex justify-center";

      class="bg-teal-700 hover:bg-teal-800 text-white px-8 py-4 rounded-2xl font-bold flex items-center gap-2">
      📸 Галерея древа
    </button>`;
  container.appendChild(vp);
  container.appendChild(galleryWrap);
  fitTreeView();
}

/* ================== МОДАЛКА ЧЕЛОВЕКА ================== */
function showPerson(id) {
  currentEditId = id;
  const p = getPerson(id);
  if (!p) return;
  const spouses = getSpouses(p);

  document.getElementById("modalName").textContent = p.name;
  const photoDiv = document.getElementById("modalPhoto");
  photoDiv.innerHTML = p.photoData
    ? `<img src="${p.photoData}" class="w-full h-full object-cover rounded-3xl">`
    : `<span class="text-8xl">${p.photo || '👤'}</span>`;
  const spouseList = spouses.length
    ? spouses.map(s => `<a onclick="closeModal(); setTimeout(()=>showPerson(${s.id}),200)" class="spouse-link">${s.name}${isPartner(s) ? ' 💑' : ' 💍'}</a>`).join(', ')
    : '';
  document.getElementById("modalInfo").innerHTML = `
    <p><strong>Годы жизни:</strong> ${p.years || '—'}</p>
    <p><strong>Биография:</strong> ${p.info || '—'}</p>
    <p><strong>Статус связи:</strong> ${p.relationType || '—'}</p>
    ${spouseList ? `<p class="pt-4 border-t"><strong>Супруг(и)/партнёр(ы):</strong> ${spouseList}</p>` : ''}
    <div class="pt-4 border-t">
      <p class="font-bold mb-2">Родители</p>
      <div class="grid grid-cols-1 gap-2">
        <label class="text-sm"><span class="font-semibold">Отец</span>
          <select id="fatherSelect" class="w-full border rounded-xl px-3 py-2 mt-1 bg-white"></select>
        </label>
        <label class="text-sm"><span class="font-semibold">Мать</span>
          <select id="motherSelect" class="w-full border rounded-xl px-3 py-2 mt-1 bg-white"></select>
        </label>
      </div>
      <button onclick="saveParentsForCurrent()" class="w-full bg-emerald-700 text-white py-3 rounded-2xl font-bold mt-3">👨‍👩‍👧 Сохранить родителей</button>
    </div>
  `;
  populateParentSelectors(p);

  document.getElementById("spouseBtn").classList.toggle("hidden", spouses.length === 0);

  const ownTreeBtn = document.getElementById("ownTreeBtn");
  const alreadyHere = (viewMode === "personal" && currentOwnerId === id);
  if (canHavePersonalTree(p) && !alreadyHere) {
    ownTreeBtn.classList.remove("hidden");
    ownTreeBtn.textContent = "🌳 Открыть древо: " + p.name;
  } else {
    ownTreeBtn.classList.add("hidden");
  }

  document.getElementById("modal").classList.remove("hidden");
}

function getPersonGender(person) {
  if (!person) return null;
  const rel = String(person.relationType || "").toLowerCase();
  const photo = String(person.photo || "");
  if (/муж|отец|сын|брат|мальчик|мужчин/.test(rel) || /👨|👴|👦/.test(photo)) return "m";
  if (/жен|мать|дочь|сестр|девочк|женщин/.test(rel) || /👩|👵|👧/.test(photo)) return "f";
  return null;
}

function getBirthYear(person) {
  if (!person || !person.years) return null;
  const m = String(person.years).match(/(?:^|[^0-9])(1[5-9]\d{2}|20\d{2})(?:[^0-9]|$)/);
  return m ? Number(m[1]) : null;
}

function clonePersonalRelativeToMain(personId, seen = new Set()) {
  const src = getPerson(personId);
  if (!src || src.treeOwnerId == null || seen.has(src.id)) return src;
  seen.add(src.id);
  const existing = family.find(x => x.treeOwnerId == null && x.name === src.name && x.years === src.years);
  if (existing) return existing;
  const newId = Math.max(...family.map(x => x.id)) + 1;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = newId;
  delete copy.treeOwnerId;
  copy.spouseIds = [];
  family.push(copy);
  return copy;
}

function syncMainTreeParentsFromPersonalTrees() {
  // Если у человека основного древа родитель находится только в личном древе,
  // автоматически создаём его копию в основном древе и заменяем ссылку.
  family.filter(inMain).forEach(person => {
    ["parentId", "parentId2"].forEach(slot => {
      const linked = getPerson(person[slot]);
      if (linked && linked.treeOwnerId != null) {
        const copy = clonePersonalRelativeToMain(linked.id);
        if (copy && copy.id !== linked.id) person[slot] = copy.id;
      }
    });
  });
}

function getParentCandidates(person, gender) {
  const sc = currentScope();
  let pool;
  if (sc === null) {
    // В основном древе показываем только людей, реально относящихся к основному древу.
    pool = family.filter(inMain);
  } else {
    // В личном древе показываем только людей, которые присутствуют именно в этом древе.
    pool = getPersonalTreeMembers(sc);
  }

  const childYear = getBirthYear(person);
  return pool
    .filter(x => x.id !== person.id)
    .filter(x => getPersonGender(x) === gender)
    .filter(x => {
      const parentYear = getBirthYear(x);
      // Если известны оба года, родитель должен быть старше ребёнка.
      // Если год неизвестен, не исключаем человека автоматически.
      return childYear == null || parentYear == null || parentYear < childYear;
    })
    .sort((a, b) => {
      const ay = getBirthYear(a), by = getBirthYear(b);
      if (ay != null && by != null) return ay - by;
      if (ay != null) return -1;
      if (by != null) return 1;
      return String(a.name).localeCompare(String(b.name), 'ru');
    });
}

function populateParentSelectors(person) {
  const father = document.getElementById("fatherSelect");
  const mother = document.getElementById("motherSelect");
  if (!father || !mother) return;
  const fatherCandidates = getParentCandidates(person, "m");
  const motherCandidates = getParentCandidates(person, "f");
  const esc = v => String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const makeOptions = (candidates, selectedId, emptyLabel) => [
    `<option value="">${emptyLabel}</option>`,
    ...candidates.map(x => `<option value="${x.id}" ${x.id === selectedId ? "selected" : ""}>${esc(x.name)}${x.years ? " — " + esc(x.years) : ""}</option>`)
  ].join("");
  father.innerHTML = makeOptions(fatherCandidates, person.parentId, "— не выбран —");
  mother.innerHTML = makeOptions(motherCandidates, person.parentId2, "— не выбрана —");
}

function saveParentsForCurrent() {
  const person = getPerson(currentEditId);
  if (!person) return;
  const fatherId = Number(document.getElementById("fatherSelect")?.value) || null;
  const motherId = Number(document.getElementById("motherSelect")?.value) || null;
  if (fatherId === person.id || motherId === person.id) return alert("Человек не может быть собственным родителем.");
  if (fatherId && motherId && fatherId === motherId) return alert("Отец и мать должны быть разными людьми.");

  const oldParents = [person.parentId, person.parentId2].filter(Boolean);
  oldParents.forEach(pid => {
    const old = getPerson(pid);
    if (old && Array.isArray(old.spouseIds)) {
      old.spouseIds = old.spouseIds.filter(id => ![fatherId, motherId].includes(id));
    }
  });

  person.parentId = fatherId;
  person.parentId2 = motherId;
  if (fatherId && motherId) {
    const father = getPerson(fatherId);
    const mother = getPerson(motherId);
    if (father && mother) {
      father.spouseIds = Array.isArray(father.spouseIds) ? father.spouseIds : [];
      mother.spouseIds = Array.isArray(mother.spouseIds) ? mother.spouseIds : [];
      if (!father.spouseIds.includes(mother.id)) father.spouseIds.push(mother.id);
      if (!mother.spouseIds.includes(father.id)) mother.spouseIds.push(father.id);
    }
  }
  saveState();
  showPerson(person.id);
  renderAll();
  showToast("👨‍👩‍👧 Родители сохранены");
}

function openOwnFamilyTree() {
  const p = getPerson(currentEditId);
  if (!p || !canHavePersonalTree(p)) return;
  closeModal();
  goToPersonalTree(p.id);
}
function openSpouseCard() {
  const p = getPerson(currentEditId);
  const spouses = getSpouses(p);
  if (spouses.length === 0) return;
  if (spouses.length === 1) {
    closeModal();
    setTimeout(() => showPerson(spouses[0].id), 250);
    return;
  }
  const prompt_text = "Кого открыть?\n" + spouses.map((s,i) => `${i+1}. ${s.name}`).join("\n");
  const answer = prompt(prompt_text, "1");
  const n = parseInt(answer, 10);
  if (n >= 1 && n <= spouses.length) {
    const targetId = spouses[n-1].id;
    closeModal();
    setTimeout(() => showPerson(targetId), 250);
  }
}

function uploadPersonPhoto(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    getPerson(currentEditId).photoData = ev.target.result;
    showPerson(currentEditId);
    renderAll();
  };
  reader.readAsDataURL(file);
}

function changeRelationStatus() {
  const p = getPerson(currentEditId);
  const status = prompt("Новый статус:", p.relationType || "");
  if (status !== null) { p.relationType = status; saveState(); showPerson(currentEditId); }
}
function closeModal() { document.getElementById("modal").classList.add("hidden"); }
function editCurrentPerson() {
  const p = getPerson(currentEditId);
  const name = prompt("Имя:", p.name); if (name === null) return;
  const years = prompt("Годы жизни:", p.years); if (years === null) return;
  const info = prompt("Биография:", p.info); if (info === null) return;
  p.name = name; p.years = years; p.info = info;
  showPerson(p.id);
  renderAll();
}

function addRelativeToCurrent() {
  const person = getPerson(currentEditId);
  const who = prompt(`Кем приходится новый человек для «${person.name}»?\n(сын, дочь, муж, жена, партнёр, отец, мать, брат, сестра)`, "сын");
  if (!who) return;
  const name = prompt("Имя нового родственника:");
  if (!name) return;
  const years = prompt("Годы жизни:", "");
  const gender = (prompt("Пол (м/ж):", "м") || "м").toLowerCase();
  const photo = gender.startsWith("ж") ? "👩" : "👨";

  const maxId = Math.max(...family.map(x => x.id)) + 1;
  const parentPalette = typeof person.palette === "number" ? person.palette : 1;
  const newPerson = {
    id: maxId, name, years: years || "", info: who + " " + person.name, photo, photoData: "",
    parentId: null, parentId2: null, spouseIds: [],
    side: "main", relationType: who, familyGroup: "main", palette: parentPalette
  };

  const w = who.toLowerCase();
  if (w.includes("сын") || w.includes("дочь") || w.includes("ребен") || w.includes("ребён")) {
    newPerson.parentId = person.id;
    const spouses = getSpouses(person);
    if (spouses.length === 1) newPerson.parentId2 = spouses[0].id;
  } else if (w.includes("муж") || w.includes("жен") || w.includes("супруг") || w.includes("партн")) {
    person.spouseIds.push(maxId);
    newPerson.spouseIds = [person.id];
    newPerson.side = "spouse";
  } else if (w.includes("брат") || w.includes("сестр")) {
    newPerson.parentId = person.parentId;
    newPerson.parentId2 = person.parentId2;
  } else if (w.includes("отец") || w.includes("мать") || w.includes("родител")) {
    if (!person.parentId) person.parentId = maxId;

/* ================== ПАНОРАМА / ЗУМ ================== */
function createTreeViewport() {
  const vp = document.createElement("div");
  vp.className = "tree-viewport";
  vp.id = "treeViewport";
  const canvas = document.createElement("div");
  canvas.className = "tree-canvas";
  canvas.id = "treeCanvas";
  const controls = document.createElement("div");
  controls.className = "zoom-controls";
  controls.onmousedown = (e) => e.stopPropagation();
  controls.ontouchstart = (e) => e.stopPropagation();
  controls.innerHTML = `
    <button type="button" onclick="zoomTree(0.85)" title="Уменьшить">−</button>
    <span class="zoom-level" id="zoomLevel">100%</span>
    <button type="button" onclick="zoomTree(1.15)" title="Увеличить">+</button>
    <button type="button" onclick="resetTreeView()" title="Сбросить вид">⌂</button>
  `;
  const help = document.createElement("div");
  help.className = "tree-help";
  help.textContent = "🖱 колесо — зум · перетаскивание — сдвиг";
  vp.appendChild(canvas);
  vp.appendChild(controls);
  vp.appendChild(help);
  vp.addEventListener("mousedown", onDragStart);
  window.addEventListener("mousemove", onDragMove);
  window.addEventListener("mouseup", onDragEnd);
  vp.addEventListener("wheel", onTreeWheel, { passive: false });
  vp.addEventListener("touchstart", onTouchStart, { passive: true });
  vp.addEventListener("touchmove", onTouchMove, { passive: false });
  vp.addEventListener("touchend", onTouchEnd);
  return { vp, canvas };
}
function updateTreeTransform() {
  const canvas = document.getElementById("treeCanvas");
  if (canvas) canvas.style.transform = `translate(${treePanX}px, ${treePanY}px) scale(${treeZoom})`;
  const lvl = document.getElementById("zoomLevel");
  if (lvl) lvl.textContent = Math.round(treeZoom * 100) + "%";
}
function zoomTree(factor, cx, cy) {
  const vp = document.getElementById("treeViewport");
  if (!vp) return;
  const oldZoom = treeZoom;
  treeZoom = Math.max(0.2, Math.min(3, treeZoom * factor));
  if (cx !== undefined && cy !== undefined) {
    const rect = vp.getBoundingClientRect();
    const px = cx - rect.left;
    const py = cy - rect.top;
    treePanX = px - (px - treePanX) * (treeZoom / oldZoom);
    treePanY = py - (py - treePanY) * (treeZoom / oldZoom);
  }
  updateTreeTransform();
}
function resetTreeView() { treeZoom = 1; treePanX = null; treePanY = 20; fitTreeView(true); }
function onTreeWheel(e) { e.preventDefault(); const factor = e.deltaY < 0 ? 1.1 : 0.9; zoomTree(factor, e.clientX, e.clientY); }
function onDragStart(e) {
  if (e.button !== 0) return;
  isDragging = true; dragMoved = false;
  dragStartX = e.clientX; dragStartY = e.clientY;
  startPanX = treePanX || 0; startPanY = treePanY || 0;
  const vp = document.getElementById("treeViewport");
  if (vp) vp.classList.add("dragging");
}
function onDragMove(e) {
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
  treePanX = startPanX + dx; treePanY = startPanY + dy;
  updateTreeTransform();
}
function onDragEnd() {
  if (!isDragging) return;
  isDragging = false;
  const vp = document.getElementById("treeViewport");
  if (vp) vp.classList.remove("dragging");
}
let touchStartDist = 0, touchStartZoom = 1;
function onTouchStart(e) {
  if (e.touches.length === 1) {
    isDragging = true; dragMoved = false;
    dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
    startPanX = treePanX || 0; startPanY = treePanY || 0;
  } else if (e.touches.length === 2) {
    isDragging = false;
    const [a, b] = e.touches;
    touchStartDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    touchStartZoom = treeZoom;
  }
}
function onTouchMove(e) {
  if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - dragStartX;
    const dy = e.touches[0].clientY - dragStartY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    treePanX = startPanX + dx; treePanY = startPanY + dy;
    updateTreeTransform();
  } else if (e.touches.length === 2) {
    e.preventDefault();
    const [a, b] = e.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (touchStartDist > 0) {
      const factor = dist / touchStartDist;
      const newZoom = Math.max(0.2, Math.min(3, touchStartZoom * factor));
      const cx = (a.clientX + b.clientX) / 2;
      const cy = (a.clientY + b.clientY) / 2;
      const oldZoom = treeZoom;
      treeZoom = newZoom;
      const vp = document.getElementById("treeViewport");
      if (vp) {
        const rect = vp.getBoundingClientRect();
        const px = cx - rect.left; const py = cy - rect.top;
        treePanX = px - (px - treePanX) * (treeZoom / oldZoom);
        treePanY = py - (py - treePanY) * (treeZoom / oldZoom);
      }
      updateTreeTransform();
    }
  }
}
function onTouchEnd() { isDragging = false; }
function fitTreeView(forceReset) {
  const vp = document.getElementById("treeViewport");
  const canvas = document.getElementById("treeCanvas");
  if (!vp || !canvas) return;
  const key = viewMode === "personal" ? "personal_" + currentOwnerId : "full";
  if (key !== treeViewKey || forceReset) {
    treeViewKey = key;
    treeZoom = 1; treePanX = null; treePanY = 20;
  }
  const canvasH = canvas.offsetHeight;
  const canvasW = canvas.offsetWidth;
  const vpH = Math.min(Math.max(canvasH + 20, 400), Math.max(400, window.innerHeight * 0.75));
  vp.style.height = vpH + "px";
  if (treePanX === null) {
    const vpW = vp.clientWidth;
    treePanX = canvasW < vpW ? Math.round((vpW - canvasW) / 2) : 20;
  }
  updateTreeTransform();
}

/* ===== ПРАВКИ: отдельные древа супругов · цвет рамки умерших · сохранение ===== */

// У человека из отдельного древа есть поле treeOwnerId (id супруга-владельца древа).
// Нет поля — человек принадлежит основному древу.
const inMain = p => p.treeOwnerId == null;
function currentScope() {
  return (viewMode === 'personal' && currentOwnerId !== null) ? currentOwnerId : null;
}

// Супруги, видимые в текущем древе (основном или отдельном)
function getSpouses(person) {
  if (!person || !Array.isArray(person.spouseIds)) return [];
  const sc = currentScope();
  return person.spouseIds.map(getPerson).filter(s => s &&
    (sc === null ? inMain(s) : (inMain(s) || s.treeOwnerId === sc || person.id === sc)));
}

// Отдельное древо = владелец + его партнёры + всё, что добавили именно в это древо
function getPersonalTreeMembers(ownerId) {
  const owner = getPerson(ownerId);
  if (!owner) return [];
  const ids = new Set([owner.id]);
  getSpouses(owner).forEach(s => ids.add(s.id));
  family.forEach(p => {
    if (p.treeOwnerId !== ownerId) return;
    ids.add(p.id);
    getSpouses(p).forEach(s => ids.add(s.id));
  });
  return family.filter(p => ids.has(p.id));
}

// Корни: у кого нет родителей в древе (владелец первым; супруги показываются рядом с партнёром)
function findRoots(members) {
  const sc = currentScope();
  const ids = new Set(members.map(m => m.id));
  const hasParent = p => [p.parentId, p.parentId2].some(x => x != null && ids.has(x));
  const cands = members.filter(p => !hasParent(p)).sort((a, b) => (b.id === sc) - (a.id === sc));
  const roots = [], covered = new Set();
  cands.forEach(c => {
    if (covered.has(c.id)) return;
    const sp = getSpouses(c).filter(s => ids.has(s.id));
    if (sp.some(hasParent)) return;
    roots.push(c);
    sp.forEach(s => covered.add(s.id));
  });
  return roots;
}

// Дети пары: ребёнок привязан к любому из родителей (parentId или parentId2)
function buildChildrenMap(members) {
  const map = new Map();
  members.forEach(m => {
    const cluster = new Set([m.id, ...getSpouses(m).map(s => s.id)]);
    map.set(m.id, sortChildrenByAge(members.filter(ch => ch.id !== m.id && (cluster.has(ch.parentId) || cluster.has(ch.parentId2)))));
  });
  return map;
}
function getBirthYearForSort(person) {
  const m = String(person?.years || "").match(/(?:^|\D)(\d{4})(?:\D|$)/);
  return m ? parseInt(m[1], 10) : null;
}
function sortChildrenByAge(children) {
  return [...children].sort((a, b) => {
    const ay = getBirthYearForSort(a), by = getBirthYearForSort(b);
    if (ay != null && by != null && ay !== by) return ay - by;
    if (ay != null && by == null) return -1;
    if (ay == null && by != null) return 1;
    return String(a.name || "").localeCompare(String(b.name || ""), "ru");
  });
}
function groupChildrenBySecondParent(children) {
  const groups = new Map();
  sortChildrenByAge(children).forEach(ch => {
    const key = [ch.parentId, ch.parentId2].filter(x => x != null).sort((a, b) => a - b).join("_") || "__none__";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(ch);
  });
  return groups;
}

function drawTree(container, members, extra) {
  const childrenMap = buildChildrenMap(members);
  const rendered = new Set();
  const { vp, canvas } = createTreeViewport();
  const treeDiv = document.createElement("div");
  treeDiv.className = "tree";
  const rootUl = document.createElement("ul");
  findRoots(members).forEach(r => renderPersonBranch(r, rootUl, childrenMap, rendered));
  treeDiv.appendChild(rootUl);
  canvas.appendChild(treeDiv);
  container.appendChild(vp);
  if (extra) container.appendChild(extra);
  fitTreeView();
}

/* ---- Старые данные: людей, ранее добавленных в древо супруга, переносим в это древо ---- */
const _migrate = migrate;
migrate = function () {
  _migrate();
  const tagDown = (p, owner) => {
    if (p.treeOwnerId != null || protectedIds.includes(p.id) || p.id === owner) return;
    p.treeOwnerId = owner;
    family.forEach(c => {
      if (c.side === "main" && (c.parentId === p.id || c.parentId2 === p.id)) tagDown(c, owner);
    });
    (p.spouseIds || []).map(getPerson).forEach(s => { if (s && s.side === "spouse") tagDown(s, owner); });
  };
  family.forEach(p => {
    if (p.side !== "main" || p.treeOwnerId != null) return;
    const par = getPerson(p.parentId);
    if (par && par.side === "spouse") tagDown(p, par.id);
  });
  family.forEach(o => {
    if (o.side !== "spouse" || o.treeOwnerId != null) return;
    [o.parentId, o.parentId2].map(getPerson).forEach(par => { if (par && par.side === "main") tagDown(par, o.id); });
  });
};

function addRelativeToCurrent() {
  const person = getPerson(currentEditId);
  const who = prompt(`Кем приходится новый человек для «${person.name}»?\n(сын, дочь, муж, жена, партнёр, отец, мать, брат, сестра)`, "сын");
  if (!who) return;
  const w = who.toLowerCase();
  const kind = /сын|дочь|ребен|ребён/.test(w) ? "child"
    : /муж|жен|супруг|партн/.test(w) ? "spouse"
    : /брат|сестр/.test(w) ? "sibling"
    : /отец|мать|родител/.test(w) ? "parent" : null;
  if (!kind) return alert("Не удалось понять родство. Допустимо: сын, дочь, муж, жена, партнёр, отец, мать, брат, сестра.");
  let slot = null;
  if (kind === "parent") {
    slot = person.parentId == null ? "parentId" : (person.parentId2 == null ? "parentId2" : null);
    if (!slot) return alert("У этого человека уже указаны оба родителя.");
  }
  const name = prompt("Имя нового родственника:");
  if (!name) return;
  const years = prompt("Годы жизни:", "");
  const gender = (prompt("Пол (м/ж):", "м") || "м").toLowerCase();
  const id = Math.max(...family.map(x => x.id)) + 1;
  const np = {
    id, name, years: years || "", info: who + " " + person.name,
    photo: gender.startsWith("ж") ? "👩" : "👨", photoData: "",
    parentId: null, parentId2: null, spouseIds: [],
    side: "main", relationType: who, familyGroup: "main",
    palette: typeof person.palette === "number" ? person.palette : 1,
    treeOwnerId: currentScope()
  };
  if (kind === "child") {
    np.parentId = person.id;
    const sp = getSpouses(person);
    if (sp.length === 1) np.parentId2 = sp[0].id;
  } else if (kind === "spouse") {
    person.spouseIds.push(id);
    np.spouseIds = [person.id];
    np.side = "spouse";
  } else if (kind === "sibling") {
    np.parentId = person.parentId;
    np.parentId2 = person.parentId2;
  } else {
    const other = getPerson(slot === "parentId" ? person.parentId2 : person.parentId);
    person[slot] = id;
    if (other) {            // второй родитель — пара первому
      other.spouseIds.push(id);
      np.spouseIds = [other.id];
      np.side = "spouse";
    }
  }
  family.push(np);
  closeModal();
  renderAll();
}

/* ===== ПРАВКИ 2: древо супруга с потомками · галерея · обрезка фото ===== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const EVENTS = ["День Рождения", "Свадьба", "Новый год", "Рождество", "День знаний", "Церковный праздник",
  "Семейный праздник", "Семейные будни", "Спортивные события", "Похороны", "Другое"];

/* ---- Древо супруга: владелец, его партнёры, ВСЕ его дети и внуки из основного древа + то, что добавили в этом древе ---- */
function getPersonalTreeMembers(ownerId) {
  const owner = getPerson(ownerId);
  if (!owner) return [];
  const ids = new Set([owner.id]), queue = [owner.id];
  getSpouses(owner).forEach(s => ids.add(s.id));
  family.forEach(p => { if (p.treeOwnerId === ownerId && !ids.has(p.id)) { ids.add(p.id); queue.push(p.id); } });
  while (queue.length) {
    const pid = queue.shift();
    family.forEach(ch => {
      if ((ch.parentId !== pid && ch.parentId2 !== pid) || ids.has(ch.id)) return;
      if (!inMain(ch) && ch.treeOwnerId !== ownerId) return;
      ids.add(ch.id); queue.push(ch.id);
    });
    getSpouses(getPerson(pid)).forEach(s => ids.add(s.id));
  }
  return family.filter(p => ids.has(p.id));
}

/* ---- Сортировка и дата ---- */
function dateKey(s) {
  s = String(s || ""); let m;
  if ((m = s.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/))) return +m[3] * 10000 + +m[2] * 100 + +m[1];
  if ((m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) return +m[1] * 10000 + +m[2] * 100 + +m[3];

function renderFamilyPhotos() { renderGallery("fam"); }

/* ---- Просмотр фото на странице: рядом описание и вся информация ---- */
let V = null;

/* ---- Окно добавления фото: обрезка + данные ---- */
function closeDlg() { $("pdlg")?.remove(); }
function cropData(img, R, dw, maxSide) {
  const k = img.naturalWidth / dw;

    function nlSend(){
      var wrap=document.querySelector('.nl-wrap'),boxes=[];
      for(var i=0;i&lt;wrap.children.length;i++){
        var c=wrap.children[i];
        if(!c.offsetWidth||!c.offsetHeight)continue;
        boxes.push({x:c.offsetLeft-wrap.offsetLeft+8,
                    y:c.offsetTop-wrap.offsetTop+8,
                    w:c.offsetWidth,h:c.offsetHeight});
      }
      parent.postMessage({nlHud:'resize',
        width:wrap.offsetWidth+26,
        height:wrap.offsetHeight+26,
        boxes:boxes},'*');
    }
    function nlSendSoon(){requestAnimationFrame(nlSend);}
    window.addEventListener('load',nlSend);
    window.addEventListener('message',function(e){
      if(e.source!==parent||!e.data||e.data.nlHud!=='viewport')return;
      var s=document.documentElement.style;
      s.setProperty('--nl-vw',e.data.w+'px');
      s.setProperty('--nl-vh',e.data.h+'px');
      document.documentElement.classList.toggle('nl-narrow',e.data.w&lt;600);
      nlSendSoon();
    });
    var nlCoarse=window.matchMedia('(pointer: coarse)').matches;
    function nlSubmit(form){
      if(form.requestSubmit)return form.requestSubmit();
      if(form.checkValidity&amp;&amp;!form.checkValidity())
        return form.reportValidity&amp;&amp;form.reportValidity();
      form.submit();
    }
  
        var btn=document.getElementById('nl-tools'),pop=document.getElementById('nl-pop');
        function setOpen(open){
          pop.classList.toggle('open',open);
          btn.setAttribute('aria-expanded',open?'true':'false');
          nlSendSoon();
        }
        btn.addEventListener('click',function(){setOpen(!pop.classList.contains('open'));});
        document.getElementById('nl-pop-close').addEventListener('click',function(){setOpen(false);btn.focus();});

        var statusBtn=document.getElementById('nl-status'),tip=document.getElementById('nl-tip'),tipTimer=null;
        function setTip(open){
          tip.classList.toggle('open',open);
          statusBtn.setAttribute('aria-expanded',open?'true':'false');
          nlSendSoon();
        }
        function openTip(){clearTimeout(tipTimer);setTip(true);}
        function closeTipSoon(){clearTimeout(tipTimer);tipTimer=setTimeout(function(){setTip(false);},200);}
        if(!nlCoarse){
          statusBtn.addEventListener('mouseenter',openTip);
          statusBtn.addEventListener('mouseleave',closeTipSoon);
          tip.addEventListener('mouseenter',openTip);
          tip.addEventListener('mouseleave',closeTipSoon);
        }
        statusBtn.addEventListener('focus',function(){
          var keyboard;
          try{keyboard=statusBtn.matches(':focus-visible');}catch(e){keyboard=!nlCoarse;}
          if(keyboard)openTip();
        });
        statusBtn.addEventListener('blur',closeTipSoon);
        statusBtn.addEventListener('click',function(){
          clearTimeout(tipTimer);
          setTip(nlCoarse ? !tip.classList.contains('open') : true);
        });

        var root=document.documentElement;
        function setStage(value){
          root.classList.toggle('nl-mini-state',value==='mini');
          if(value==='mini'){setOpen(false);setTip(false);}
          parent.postMessage({nlHud:'state',value:value},'*');
          nlSendSoon();
        }
        document.getElementById('nl-min').addEventListener('click',function(){
          setStage('mini');
          document.getElementById('nl-mini-open').focus();
        });
        document.getElementById('nl-mini').addEventListener('click',function(e){
          if(e.target.closest('#nl-mini-hide'))return;
          setStage('');
          document.getElementById('nl-min').focus();
        });
        document.getElementById('nl-mini-hide').addEventListener('click',function(){
          parent.postMessage({nlHud:'state',value:'hidden'},'*');
        });
        document.addEventListener('keydown',function(e){
          if(e.key!=='Escape')return;
          if(tip.classList.contains('open')){setTip(false);statusBtn.focus();return;}
          if(pop.classList.contains('open')){setOpen(false);btn.focus();}
        });
      &lt;/script&gt;
